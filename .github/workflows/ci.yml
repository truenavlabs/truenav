# CI: engine, certificates and TEE tests; contract tests and lint; dependency audits; secret scan.
# Every third-party action is pinned to a full commit SHA (tag in the comment). No secrets are used.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Receipt v3 frozen interface vectors and schema
        run: |
          node --test receipts/tests/receipt-v3-interface.test.mjs
          python3 -m venv "$RUNNER_TEMP/receipt-v3-schema"
          "$RUNNER_TEMP/receipt-v3-schema/bin/pip" install jsonschema==4.23.0
          "$RUNNER_TEMP/receipt-v3-schema/bin/python" receipts/tests/receipt-v3-schema.test.py
          "$RUNNER_TEMP/receipt-v3-schema/bin/python" receipts/tests/receipt-v3.0.1-schema.test.py
          "$RUNNER_TEMP/receipt-v3-schema/bin/python" receipts/tests/receipt-v3-privacy.test.py
      - run: npm run tee:demo
      - run: npm run eval
      # Ganache is used only by local EVM tests; gate on production dependencies.
      - run: npm audit --omit=dev --audit-level=high

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.97.0 with clippy
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy && rustup default 1.97.0
      - name: Unit tests (incl. real TEE-signed verdicts)
        working-directory: contract
        run: cargo test --locked
      - name: Clippy
        working-directory: contract
        run: cargo clippy --locked --tests -- -D warnings
      - name: Circuit breaker vault tests and clippy
        working-directory: vault
        run: cargo test --locked && cargo clippy --locked --tests -- -D warnings
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2
      - name: RustSec audit every Rust workspace
        run: |
          set -euo pipefail
          for d in contract receipts query vault engine/v3-core outlayer/engine-v2 outlayer/engine-v3 outlayer/fingerprint outlayer/quote-check mirror/mock-signer receipts/mock-outlayer receipts/tests/outlayer-output-parity; do
            echo "cargo audit in $d"
            (cd "$d" && cargo audit)
          done

  engine-v2:
    # outlayer/engine-v2 (the cashflow-v2.0.0 OutLayer module): native tests (raw-data parity on the 4 funds, edge
    # cases, TEE flow), clippy native and wasm32-wasip2, then the wasm32-wasip2 build in the pinned image, whose
    # sha256 must equal the one recorded in outlayer/engine-v2/BUILD.md.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.99.0 with clippy and wasm32-wasip2
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy --target wasm32-wasip2
      - name: cargo test (native)
        working-directory: outlayer/engine-v2
        run: cargo +1.99.0 test --locked
      - name: Clippy (native and wasm32-wasip2)
        working-directory: outlayer/engine-v2
        run: cargo +1.99.0 clippy --locked --all-targets -- -D warnings && cargo +1.99.0 clippy --locked --target wasm32-wasip2 -- -D warnings
      - name: wasm32-wasip2 build in the pinned image, sha256 must match BUILD.md
        run: |
          docker run --rm -u 0 -v "$PWD:/code" -w /code/outlayer/engine-v2 -e RUSTUP_TOOLCHAIN=1.99.0 \
            sourcescan/cargo-near:0.22.0-rust-1.99.0@sha256:51ab40efd798eae26c0dc71180909303f10bb4988b15ce3a18522c5be06e277e \
            bash -c 'rustup target add wasm32-wasip2 && cargo build --release --locked --target wasm32-wasip2'
          got=$(sha256sum outlayer/engine-v2/target/wasm32-wasip2/release/truenav-engine-v2.wasm | cut -d' ' -f1)
          want=$(grep -oE '^\| wasm sha256 \| `[0-9a-f]{64}`' outlayer/engine-v2/BUILD.md | grep -oE '[0-9a-f]{64}')
          echo "built $got, BUILD.md $want"
          test -n "$want" && test "$got" = "$want"

  engine-v3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Rust 1.99.0 and WASI component target
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy --target wasm32-wasip2
      - name: Python schema validator
        run: |
          python3 -m venv "$RUNNER_TEMP/engine-v3-schema"
          "$RUNNER_TEMP/engine-v3-schema/bin/pip" install jsonschema==4.23.0
          echo "$RUNNER_TEMP/engine-v3-schema/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Pinned engine hash and committed vector conformance
        run: node outlayer/engine-v3/check-local.mjs
      - name: Backend Clippy
        run: |
          cargo +1.99.0 clippy --locked --all-targets --manifest-path engine/v3-core/Cargo.toml -- -D warnings
          cargo +1.99.0 clippy --locked --all-targets --manifest-path outlayer/engine-v3/Cargo.toml -- -D warnings
          cargo +1.99.0 clippy --locked --target wasm32-wasip2 --manifest-path outlayer/engine-v3/Cargo.toml -- -D warnings

  receipts:
    # Build step 4: receipt contract and paid query contract unit tests and clippy, their wasm (and the test-only mock
    # OutLayer) built in the pinned image, then the full flow on a local NEAR sandbox: request_run, the engine run
    # natively as the OutLayer worker, the callback storing the receipt, an agent buying and spending entitlements
    # through the API.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Rust 1.99.0 with clippy
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - name: Unit tests and clippy (receipts, query, mock OutLayer, mock signer)
        run: |
          for d in receipts query receipts/mock-outlayer mirror/mock-signer; do
            (cd $d && cargo +1.99.0 test --locked && cargo +1.99.0 clippy --locked --all-targets -- -D warnings)
          done
          (cd engine/v3-core && cargo +1.99.0 test --locked --features dry-run-tests)
          (cd outlayer/engine-v3 && cargo +1.99.0 test --locked --features dry-run-tests)
          (cd receipts && cargo +1.99.0 test --locked --features dry-run-tests)
          python3 -m venv "$RUNNER_TEMP/engine-privacy"
          "$RUNNER_TEMP/engine-privacy/bin/pip" install jsonschema==4.23.0
          "$RUNNER_TEMP/engine-privacy/bin/python" receipts/tests/engine-v3-privacy.test.py
      - name: Attestation suite with Rust 1.99.0 (the output parity test runs here, not skipped)
        run: node --test receipts/attestation/*.test.mjs
      - name: Contract wasm in the pinned image (receipts, query, mock OutLayer, mock signer)
        run: |
          for d in receipts query receipts/mock-outlayer mirror/mock-signer; do
            if [ "$d" = receipts ]; then
              # Match the candidate's canonical image user, workdir and target paths.
              docker run --rm -u 0 -v "$PWD:/home/near/code" -w /home/near/code/receipts \
                sourcescan/cargo-near:0.22.0-rust-1.99.0@sha256:51ab40efd798eae26c0dc71180909303f10bb4988b15ce3a18522c5be06e277e \
                bash -c 'cargo near build non-reproducible-wasm --locked && chmod -R a+rX target/near'
            else
              docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/home/near/code" -w /home/near/code/$d \
                sourcescan/cargo-near:0.22.0-rust-1.99.0@sha256:51ab40efd798eae26c0dc71180909303f10bb4988b15ce3a18522c5be06e277e \
                cargo near build non-reproducible-wasm --locked
            fi
          done
      - name: Built contract wasm matches receipts/pinned-builds.json
        run: |
          for c in receipts query; do
            want=$(node -e "process.stdout.write(require('./receipts/pinned-builds.json')['$c'])")
            got=$(sha256sum "$c/target/near/truenav_$c.wasm" | cut -d' ' -f1)
            echo "$c built $got pinned $want"
            [ "$got" = "$want" ] || { echo "::error::$c wasm $got does not match the pinned $want"; exit 1; }
          done
      - name: Sandbox account string is absent from pinned and default wasm
        run: node receipts/check-sandbox-account.mjs --expect
      - name: Sandbox-feature receipts wasm in target/near-sandbox
        run: |
          docker run --rm -u 0 -v "$PWD:/home/near/code" -w /home/near/code/receipts \
            sourcescan/cargo-near:0.22.0-rust-1.99.0@sha256:51ab40efd798eae26c0dc71180909303f10bb4988b15ce3a18522c5be06e277e \
            bash build-sandbox-wasm.sh
          sudo chown -R "$(id -u):$(id -g)" receipts/target
          node receipts/check-sandbox-account.mjs --expect
          grep -a -q 'outlayer.test.near' receipts/target/near-sandbox/truenav_receipts.wasm
      - name: Stamp the pinned-image wasm so the sandbox steps use it and never rebuild on the host
        run: node receipts/e2e/stamp-wasm.mjs
      - name: Native engine for the worker
        working-directory: outlayer/engine-v2
        run: cargo +1.99.0 build --locked --example native
      - name: End to end on the sandbox
        run: ulimit -n 65535 && npm run e2e:receipts
      - name: V3 migration and metered callback from the retained v2 wasm
        run: ulimit -n 65535 && node receipts/e2e/v3-sandbox.mjs
      - name: Mirror with a mocked signer on the local sandbox
        run: ulimit -n 65535 && npm run e2e:mirror

  sandbox:
    # Full flow on a local NEAR sandbox node: deploy the wasm, signers, funds, 16 pledges, 16 TEE-signed
    # verdicts verified by the contract, score from chain, certificates, double-pledge refusal.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Build the wasm in the pinned reproducible-build image
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/home/near/code" -w /home/near/code/contract \
            sourcescan/cargo-near:0.22.0-rust-1.99.0@sha256:51ab40efd798eae26c0dc71180909303f10bb4988b15ce3a18522c5be06e277e \
            cargo near build non-reproducible-wasm --locked
      - name: End to end on the sandbox
        run: ulimit -n 65535 && npm run e2e:sandbox

  judge-path:
    # The README judge path from a fresh checkout with no secrets. First the offline judge (npm run judge -- --replay,
    # S1 to S10: fixture guard, tamper demo, engine, v3 pin, failed head, paid report, dashboard data, mirror, local
    # attestation slice, wasm stamp), which fails on any network use. Then the live reads, which are not part of the
    # judge: chain:read against the current registry.tnlab-368aa2.testnet (certificates and pledges; TEE pending),
    # and the NEAR AI Cloud attestation, every OutLayer fingerprint and the reply check over every submit_verdict
    # on the earlier instance tnlab-718ca9 (contract commit d37b9d2), which still holds the recorded TEE verdicts.
    # npm test, the demo again and the eval run in the engine job; contract and vault tests, clippy and RustSec in
    # the contract job; the full flow on a local node in the sandbox job; gitleaks in the secrets job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: judge replay (offline, S1 to S10)
        run: npm run judge -- --replay
        timeout-minutes: 2
      - name: live read, registry.tnlab-368aa2.testnet
        run: npm run chain:read
      - name: live attestation, earlier instance tnlab-718ca9
        run: TRUENAV_CONTRACT=registry.tnlab-718ca9.testnet npm run verify:attestation
      - name: live fingerprints, earlier instance tnlab-718ca9
        run: npm run verify:fingerprints
      - name: live chain replies, earlier instance tnlab-718ca9
        run: TRUENAV_CONTRACT=registry.tnlab-718ca9.testnet npm run check:chain-replies

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.11"
          cache: false
      - name: gitleaks 8.30.1 (Go module proxy, checksum-verified) over the full history
        run: |
          # the release download 504'd on the runners (runs 52 to 60, 8 Nov); go install fetches the v8.30.1 module
          # from the Go module proxy and verifies it and every dependency against the checksum database
          # (sum.golang.org; v8.30.1 h1:PmEvCfVI7ti9dV3s5aMZUY7sS2GxRvG3yzih7E+cS3w=), failing on any mismatch
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --log-opts="--all" .
