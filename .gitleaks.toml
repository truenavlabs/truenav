# gitleaks configuration: the default rules, plus documented allowlists.
[extend]
useDefault = true

[[allowlists]]
description = "Published NEAR AI Cloud attestation reports (both encodings; the earlier instance's and the one recorded for registry.tnlab-368aa2.testnet). gitleaks 8.30.1 decodes the .b64 body and, over this repo's history, reports generic-api-key hits only on public signing_key and ohttp key_config / ohttp_key_config fields (32-byte public verification keys and public OHTTP key configurations, RFC 9458: key id, X25519 KEM 0x0020, public key, cipher suites), served by NEAR AI Cloud's public attestation endpoint. The decoded text also mentions credentials only as environment variable names such as ${MODEL_DISCOVERY_API_KEY}, never a value. No private key is in these files. This entry covers only those files, only generic-api-key, and only a signing_key or key_config set to hex, or a ${ENV_VAR} name; any other value or rule is still reported."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tee/fixtures/attestation-report(-368aa2)?\.json(\.b64)?$''']
regexTarget = "match"
regexes = [
  '''ing_key"\s*:\s*"?[0-9a-fA-F]{16,}''',
  '''key_config"\s*:\s*"[0-9a-fA-F]{16,}''',
  '''\$\{[A-Z][A-Z0-9_]+\}''',
]

[[allowlists]]
description = "The same published attestation reports: gitleaks 8.30.1 also reports square-access-token on two fragments of the public Intel TDX quote body (base64 that happens to start with EAAA, including one that carries the ASCII system-preparing / app-id label). These are not Square tokens. This entry covers only those files, only square-access-token, and only the two exact fragments observed across history; any other value or rule is still reported."
targetRules = ["square-access-token"]
condition = "AND"
paths = ['''^tee/fixtures/attestation-report(-368aa2)?\.json(\.b64)?$''']
regexTarget = "secret"
regexes = [
  '''^EAAAgAQHN5c3RlbS1wcmVwYXJpbmcAAwAAAAEAAAgAGGFwcC1p$''',
  '''^EAAAdldOmfIMsYJCgMTmOiqgnNZLKX59CVKBQzoZ3dY2cAV6aEnUCcG8g$''',
]

[[allowlists]]
description = "Public wasm build SHA256 pins, not credentials. They appear as engine_version_key, engine_code_sha256 and version_key in test vectors, web fixtures and the OutLayer spike. Exact values only, generic-api-key only: any other value, and every other rule, is still reported. 098f5d86 is the current engine v3 pin (receipts/v3-build.json engine.sha256); 4ce9e539, 61fe33a0, 0ffb3e31, 8e3d8925 and c3299ccf are earlier engine v3 pins from this repo's history; 4e376db0 is the OutLayer spike wasm (outlayer/spike/BUILD.md); 360cd473 is the engine v2 build hash (outlayer/engine-v2/BUILD.md), the version_key the live receipts contract stores. Add a new pin here when it is published, after checking it is a build hash."
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^098f5d86a94288d13fac1ca66b8aba9c20a2dc1b3585a64ef91d5bba5aa68788$''',
  '''^4ce9e539b5bed2eb9dbcc0037168633297a337843d0f86ec0790e8d8342677a0$''',
  '''^61fe33a0299ae77fcb42c6d804f782845cbe5f50cb3153b3b43dbe45ea63f0bb$''',
  '''^0ffb3e314f2a3881bd28ab70cb9ba01a6f9b6f6fe41af8ef81b0455ce9ca8d38$''',
  '''^8e3d892547c23b8c4a0c84717a3c54de596ecb6ba72f9ca264a0488297a6c4ad$''',
  '''^c3299ccf5414c351bc3e8fc773ca2bccddeedc1b71974e36a21bfebaee092fb2$''',
  '''^4e376db0cd17ef7f11f0d8602ed9367e66905c4cb4443bae881615a5cedf28eb$''',
  '''^360cd47346db7060ffb213288e25a6d5e39050133bd4e20ad2f6f9280b1daa57$''',
]

[[allowlists]]
description = "schema/vectors/engine-v3-derived.json: gitleaks with only its default rules reports 27 generic-api-key hits in this file across 4 commits (red-team final pass, 13 Nov 2026). Every one is an engine_version_key value, a public engine v3 wasm build sha256 (61fe33a0, 0ffb3e31, 8e3d8925, c3299ccf, all listed above). This entry covers only that file, only generic-api-key, and only an engine_version_key set to 64 lowercase hex characters; any other key or rule in the file is still reported."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^schema/vectors/engine-v3-derived\.json$''']
regexTarget = "match"
regexes = ['''^engine_version_key"\s*:\s*"[0-9a-f]{64}"?$''']

[[allowlists]]
description = "Recorded public snapshot of registry.tnlab-368aa2.testnet, and the live-read helper's example view-call arguments. gitleaks 8.30.1 reports 18 generic-api-key hits, all in commit 17fd17ae (Web A2). 16 are token_id values in web/data/recorded/registry-368aa2.json (each equal to that loan's public loan_hash, 64 lowercase hex). One is pledgeKey in the same file, the registry's on-chain servicer pledge address from get_servicer_pledge_key (0x plus 40 hex, an Ethereum-style public address, not a private key). One is the example token_id in web/data/registry.mjs used for the nft_token view call (the same public loan_hash). This entry covers only those two files, only generic-api-key, and only a token_id set to 64 lowercase hex or a pledgeKey set to a 0x-plus-40-hex address; any other value or rule is still reported."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^web/data/recorded/registry-368aa2\.json$''', '''^web/data/registry\.mjs$''']
regexTarget = "match"
regexes = [
  '''^token_id"?\s*:\s*"[0-9a-f]{64}"$''',
  '''^pledgeKey"\s*:\s*"0x[0-9a-fA-F]{40}"$''',
]
