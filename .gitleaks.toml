# gitleaks configuration: the default rules, plus two documented allowlists.
[extend]
useDefault = true

[[allowlists]]
description = "Published NEAR AI Cloud attestation reports (both encodings; the earlier instance's and the one recorded for registry.tnlab-368aa2.testnet). The decoded text mentions credentials only as environment variable names such as ${MODEL_DISCOVERY_API_KEY}, never a value. Its signing_key fields are 32-byte public verification keys and its ohttp_key_config fields are public OHTTP key configurations (RFC 9458: key id, X25519 KEM 0x0020, public key, cipher suites), served by NEAR AI Cloud's public attestation endpoint. No private key is in these files."
paths = ['''^tee/fixtures/attestation-report(-368aa2)?\.json(\.b64)?$''']

[[allowlists]]
description = "Public wasm build SHA256 pins, not credentials. They appear as engine_version_key, engine_code_sha256 and version_key in test vectors, web fixtures and the OutLayer spike. Exact values only, generic-api-key only: any other value, and every other rule, is still reported. 61fe33a0 is the current engine v3 pin (receipts/v3-build.json engine.sha256); 0ffb3e31, 8e3d8925 and c3299ccf are earlier engine v3 pins from this repo's history; 4e376db0 is the OutLayer spike wasm (outlayer/spike/BUILD.md). Add a new pin here when it is published, after checking it is a build hash."
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^61fe33a0299ae77fcb42c6d804f782845cbe5f50cb3153b3b43dbe45ea63f0bb$''',
  '''^0ffb3e314f2a3881bd28ab70cb9ba01a6f9b6f6fe41af8ef81b0455ce9ca8d38$''',
  '''^8e3d892547c23b8c4a0c84717a3c54de596ecb6ba72f9ca264a0488297a6c4ad$''',
  '''^c3299ccf5414c351bc3e8fc773ca2bccddeedc1b71974e36a21bfebaee092fb2$''',
  '''^4e376db0cd17ef7f11f0d8602ed9367e66905c4cb4443bae881615a5cedf28eb$''',
]

[[allowlists]]
description = "Recorded public snapshot of registry.tnlab-368aa2.testnet, and the live-read helper's example view-call arguments. gitleaks 8.30.1 reports 18 generic-api-key hits, all in commit 17fd17ae (Web A2). 16 are token_id values in web/data/recorded/registry-368aa2.json (each equal to that loan's public loan_hash, 64 lowercase hex). One is pledgeKey in the same file, the registry's on-chain servicer pledge address from get_servicer_pledge_key (0x plus 40 hex, an Ethereum-style public address, not a private key). One is the example token_id in web/data/registry.mjs used for the nft_token view call (the same public loan_hash). This entry covers only those two files, only generic-api-key, and only a token_id set to 64 lowercase hex or a pledgeKey set to a 0x-plus-40-hex address; any other value or rule is still reported."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^web/data/recorded/registry-368aa2\.json$''', '''^web/data/registry\.mjs$''']
regexTarget = "match"
regexes = [
  '''^token_id"?\s*:\s*"[0-9a-f]{64}"$''',
  '''^pledgeKey"\s*:\s*"0x[0-9a-fA-F]{40}"$''',
]
