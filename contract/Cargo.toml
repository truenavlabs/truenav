[package]
name = "truenav-registry"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
publish = false
repository = "https://github.com/truenavlabs/truenav"
description = "TrueNav test registry: signer registry, signed score certificates, one-time loan pledges as NEP-171 tokens, blocked-attempt counter. Testnet only."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.1", default-features = false, features = ["unstable"] }
near-contract-standards = "=5.30.1"
hex = "=0.4.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
lol_alloc = "=0.4.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", default-features = false, features = ["unstable", "unit-testing"] }
k256 = { version = "=0.13.4", features = ["ecdsa"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Reproducible build (docs.near.org/smart-contracts/anatomy/reduce-size, NEP-330): anyone can rebuild the exact
# wasm in this pinned image and compare its hash with the deployed code. Run: cargo near build reproducible-wasm
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.0"
image_digest = "sha256:51ab40efd798eae26c0dc71180909303f10bb4988b15ce3a18522c5be06e277e"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
