[package]
name = "truenav-v3-core"
version = "3.0.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["preserve_order", "float_roundtrip"] }
sha2 = "=0.10.9"
hex = "=0.4.3"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
unicode-normalization = "=0.1.25"
ryu-js = "=1.0.2"

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }

[features]
dry-run-tests = []
