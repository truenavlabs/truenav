[package]
name = "truenav-engine-v2"
version = "2.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "TrueNav cashflow-v2.0.0 scoring in an OutLayer TEE: three-way match of due, claimed and bank-settled cash, cash yield, rental coverage, cohorts, freshness, red-flag caps. Prints an aggregate-only receipt."

[lib]
path = "src/lib.rs"

[[bin]]
name = "truenav-engine-v2"
path = "src/main.rs"

[dependencies]
serde_json = { version = "=1.0.145", features = ["preserve_order"] }
sha2 = "=0.10.9"
hmac = "=0.12.1"
hex = "=0.4.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "=0.36.0"
wasi-http-client = "=0.2.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
