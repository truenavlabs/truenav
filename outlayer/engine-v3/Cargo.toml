[package]
name = "truenav-engine-v3"
version = "3.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "truenav-engine-v3"
path = "src/main.rs"

[dependencies]
truenav-v3-core = { path = "../../engine/v3-core" }
truenav-engine-v2 = { path = "../engine-v2" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["preserve_order", "float_roundtrip"] }
hex = "=0.4.3"
sha2 = "=0.10.9"
hmac = "=0.12.1"
getrandom = "=0.3.4"
base64 = "=0.22.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "=0.36.0"
wasi-http-client = { version = "=0.2.1", features = ["json"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
overflow-checks = true

[dev-dependencies]
ed25519-dalek = "=2.2.0"

[features]
dry-run-tests = ["truenav-v3-core/dry-run-tests"]
