[package]
name = "truenav-quote-check"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
dcap-qvl = { version = "=0.7.0", default-features = false, features = ["rustcrypto", "std", "default-x509"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
hex = "=0.4.3"

[profile.release]
opt-level = "s"
