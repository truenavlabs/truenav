[package]
name = "truenav-receipts"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/truenavlabs/truenav"
description = "TrueNav receipt contract: requests a pinned OutLayer run per token and stores the public checks receipt it returns. Testnet only."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
truenav-v3-core = { path = "../engine/v3-core" }
near-sdk = { version = "=5.30.1", default-features = false, features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "=5.30.1", default-features = false, features = ["unstable", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.0"
image_digest = "sha256:51ab40efd798eae26c0dc71180909303f10bb4988b15ce3a18522c5be06e277e"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[features]
dry-run-tests = ["truenav-v3-core/dry-run-tests"]
# Local near-sandbox only. Testnet builds do not enable this, so new() rejects outlayer.test.near.
sandbox = []
