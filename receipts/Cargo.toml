[package]
name = "truenav-receipts"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
publish = false
repository = "https://github.com/truenavlabs/truenav"
description = "TrueNav receipt contract: requests a pinned OutLayer run per token and stores the public checks receipt it returns. Testnet only."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.1", features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.0"
image_digest = "sha256:51ab40efd798eae26c0dc71180909303f10bb4988b15ce3a18522c5be06e277e"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
