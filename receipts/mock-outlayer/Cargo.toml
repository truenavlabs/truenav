[package]
name = "mock-outlayer"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
publish = false
description = "Local sandbox stand-in for outlayer.testnet request_execution (yield and resume). Test only, never deployed to testnet."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.1" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
